<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="일일점검표">
  <title>화물차 일일점검표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { -webkit-tap-highlight-color: transparent; }
    canvas { touch-action: none; }
    
    @media print {
      @page { size: A4 landscape; margin: 0; }
      body { background: white; margin: 0; padding: 8mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      #screen-start, #screen-inspection { display: none !important; }
      #screen-monthly { display: block !important; position: static; width: 100%; min-height: auto; padding: 0; }
      .print-table { border-collapse: collapse; width: 100%; font-size: 10px; }
      .print-table th, .print-table td { border: 1px solid black; padding: 2px 4px; text-align: center; vertical-align: middle; }
      .print-table .item-text { text-align: left; font-size: 9px; line-height: 1.2; }
    }

    .print-table { border-collapse: collapse; width: 100%; font-size: 11px; }
    .print-table th, .print-table td { border: 1px solid #d1d5db; padding: 4px; text-align: center; vertical-align: middle; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-10">

  <!-- 시작 화면 -->
  <div id="screen-start" class="max-w-md mx-auto bg-white min-h-screen p-6 shadow-md block">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">일일 점검 시작</h1>
    
    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">점검 날짜</label>
      <div class="flex space-x-2 w-full">
        <select id="selYear" class="w-1/3 p-3 border rounded-lg bg-gray-50 text-center appearance-none"></select>
        <select id="selMonth" class="w-1/3 p-3 border rounded-lg bg-gray-50 text-center appearance-none"></select>
        <select id="selDay" class="w-1/3 p-3 border rounded-lg bg-gray-50 text-center appearance-none"></select>
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">앱 구동 시간</label>
      <div id="currentTimeText" class="w-full p-3 border rounded-lg bg-gray-100 text-gray-500 font-mono text-center"></div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">운행 여부</label>
      <div class="flex space-x-4">
        <label class="flex items-center"><input type="radio" name="runStatus" value="운행" checked class="mr-2 w-5 h-5"> 운행</label>
        <label class="flex items-center"><input type="radio" name="runStatus" value="휴무" class="mr-2 w-5 h-5"> 휴무</label>
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">누적운행거리 (km)</label>
      <input type="number" id="mileage" class="w-full p-3 border rounded-lg bg-gray-50" placeholder="예: 150000">
    </div>

    <hr class="my-6">

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">차량번호</label>
      <input type="text" id="vehicleNum" class="w-full p-3 border rounded-lg bg-gray-50" placeholder="예: 서울80바1234">
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">운수종사자명 (기사)</label>
      <input type="text" id="driverName" class="w-full p-3 border rounded-lg bg-gray-50" placeholder="이름 입력">
    </div>

    <div class="mb-6">
      <label class="block text-sm font-bold mb-2">운송사업자명 (회사)</label>
      <input type="text" id="companyName" class="w-full p-3 border rounded-lg bg-gray-50" placeholder="회사명 입력">
    </div>

    <div class="flex flex-col space-y-3">
      <button id="btn-go" onclick="goToInspection()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg shadow-lg text-lg">점검 화면으로 이동</button>
      <button onclick="openMonthlyView()" class="w-full bg-gray-700 text-white font-bold py-4 rounded-lg shadow-lg text-lg">월간 내역 보기</button>
    </div>
  </div>

  <!-- 점검 화면 -->
  <div id="screen-inspection" class="max-w-md mx-auto bg-white min-h-screen p-6 shadow-md hidden">
    <h2 class="text-xl font-bold mb-4 border-b pb-2">점검 항목</h2>
    <div id="inspection-items" class="space-y-6 mb-8">
      <!-- JS 자동 생성 -->
    </div>

    <div class="mb-6">
      <label class="block text-sm font-bold mb-2">점검자 확인 (서명)</label>
      <div class="border-2 border-gray-300 rounded-lg bg-gray-50 relative">
        <canvas id="signatureCanvas" width="350" height="150" class="w-full bg-white"></canvas>
      </div>
      <button onclick="clearSignature()" class="mt-2 text-sm text-gray-500 underline">서명 지우기</button>
    </div>

    <div class="flex space-x-3 w-full">
      <button onclick="goBack('screen-inspection')" class="w-1/3 bg-gray-300 text-gray-800 font-bold py-4 rounded-lg">이전</button>
      <button id="btn-save" onclick="finishInspection()" class="w-2/3 bg-green-600 text-white font-bold py-4 rounded-lg shadow-lg">점검 완료 및 서버 저장</button>
    </div>
  </div>

  <!-- 월간 내역 화면 -->
  <div id="screen-monthly" class="max-w-6xl mx-auto bg-white min-h-screen p-4 hidden">
    <div class="flex flex-wrap justify-between items-center mb-6 no-print gap-4">
      <button onclick="goBack('screen-monthly')" class="bg-gray-300 text-gray-800 px-5 py-3 rounded-lg font-bold">홈으로</button>
      
      <div class="flex items-center space-x-2 bg-gray-50 p-2 rounded-lg border">
        <select id="viewYear" class="p-2 border rounded-lg bg-white appearance-none text-center"></select>
        <span class="font-bold text-sm">년</span>
        <select id="viewMonth" class="p-2 border rounded-lg bg-white appearance-none text-center"></select>
        <span class="font-bold text-sm">월</span>
        <button onclick="loadMonthlyData()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold shadow">조회</button>
      </div>

      <button onclick="window.print()" class="bg-blue-600 text-white px-5 py-3 rounded-lg font-bold shadow">PDF 저장</button>
    </div>
    
    <div id="print-area">
      <div class="flex justify-between items-end mb-2">
        <h2 class="text-xl font-bold ml-auto mr-auto">화물자동차 운수종사자 일상점검표</h2>
      </div>
      
      <table class="print-table mb-2 w-full border-black">
        <tr>
          <th class="bg-gray-100 w-1/8 border-black">점검연월</th><td id="lbl-month" class="w-1/8 font-bold border-black"></td>
          <th class="bg-gray-100 w-1/8 border-black">운송사업자명</th><td id="lbl-company" class="w-1/4 border-black"></td>
          <th class="bg-gray-100 w-1/8 border-black">차량번호</th><td id="lbl-vehicle" class="w-1/8 border-black"></td>
          <th class="bg-gray-100 w-1/8 border-black">운수종사자명</th><td id="lbl-driver" class="w-1/8 border-black"></td>
        </tr>
      </table>
      
      <div class="overflow-x-auto w-full">
        <table class="print-table w-full min-w-[800px] border-black">
          <thead>
            <tr class="bg-gray-100">
              <!-- rowspan="2"를 추가하여 날짜 표가 좌측으로 밀려 들어가는 오류 수정 -->
              <th colspan="2" rowspan="2" class="w-1/4 border-black">점검항목</th>
              <th colspan="31" class="border-black border-b-0">점검결과 (양호 O, 불량 X, 미운행시 "미" 기입)</th>
            </tr>
            <tr id="days-header" class="bg-gray-100"></tr>
          </thead>
          <tbody id="monthly-tbody"></tbody>
        </table>
      </div>
      
      <div class="text-xs text-left mt-2">
        ■ 화물자동차 운수사업법 시행규칙 별지 제14호의5 서식 (2026.6.30 시행)
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbww6ttd6gVjsk6oSkhiIvhl_3qjPIi_Zag317wOX8ScTcBd18i6DwY88XHPQdoThnwCGA/exec';

    const items = [
      "번호판, 전면유리, 후사경 등의 청결상태",
      "후미등, 차폭등 등 등화장치 작동상태",
      "창닦이기 작동상태",
      "적재함(보조지지대 포함), 측면 보호대, 후부반사판 등 상태",
      "타이어 손상 및 마모(1.6mm이상) 여부",
      "화물, 적재함 지지대(판스프링) 등의 고정상태",
      "바퀴 너트 등 균열 여부",
      "냉각수, 공기압, 엔진오일 등 차량 이상 여부",
      "좌석안전띠 상태",
      "소화기 비치 여부",
      "안전삼각대 등 비치 여부"
    ];

    let canvas, ctx;
    let isDrawing = false;

    window.onload = () => {
      initDateSelects();

      document.getElementById('vehicleNum').value = localStorage.getItem('vehicleNum') || '';
      document.getElementById('driverName').value = localStorage.getItem('driverName') || '';
      document.getElementById('companyName').value = localStorage.getItem('companyName') || '';
      document.getElementById('mileage').value = localStorage.getItem('mileage') || ''; 

      const container = document.getElementById('inspection-items');
      items.forEach((item, index) => {
        container.innerHTML += `
          <div class="bg-gray-50 p-3 rounded-lg border w-full">
            <p class="text-sm font-medium mb-3">${index + 1}. ${item}</p>
            <div class="flex justify-around">
              <label class="flex items-center text-blue-600 font-bold"><input type="radio" name="item${index}" value="양호" checked class="mr-1 w-5 h-5"> 양호(O)</label>
              <label class="flex items-center text-red-600 font-bold"><input type="radio" name="item${index}" value="불량" class="mr-1 w-5 h-5"> 불량(X)</label>
              <label class="flex items-center text-gray-500 font-bold"><input type="radio" name="item${index}" value="미" class="mr-1 w-5 h-5"> 미운행</label>
            </div>
          </div>
        `;
      });

      initSignature();
    };

    function initDateSelects() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();

      let yearHtml = '';
      for(let i = y - 2; i <= y + 2; i++) yearHtml += `<option value="${i}">${i}년</option>`;
      document.getElementById('selYear').innerHTML = yearHtml;
      document.getElementById('selYear').value = y;
      document.getElementById('viewYear').innerHTML = yearHtml; 
      document.getElementById('viewYear').value = y;

      let monthHtml = '';
      for(let i = 1; i <= 12; i++) monthHtml += `<option value="${String(i).padStart(2,'0')}">${i}월</option>`;
      document.getElementById('selMonth').innerHTML = monthHtml;
      document.getElementById('selMonth').value = String(m).padStart(2,'0');
      document.getElementById('viewMonth').innerHTML = monthHtml; 
      document.getElementById('viewMonth').value = String(m).padStart(2,'0');

      let dayHtml = '';
      for(let i = 1; i <= 31; i++) dayHtml += `<option value="${String(i).padStart(2,'0')}">${i}일</option>`;
      document.getElementById('selDay').innerHTML = dayHtml;
      document.getElementById('selDay').value = String(d).padStart(2,'0');

      const timeStr = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' });
      document.getElementById('currentTimeText').innerText = `접속 시간: ${timeStr}`;
    }

    function getSelectedDateStr() {
      return `${document.getElementById('selYear').value}-${document.getElementById('selMonth').value}-${document.getElementById('selDay').value}`;
    }

    function initSignature() {
      canvas = document.getElementById('signatureCanvas');
      ctx = canvas.getContext('2d');
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'black';

      canvas.addEventListener('touchstart', startPos, {passive: false});
      canvas.addEventListener('touchmove', draw, {passive: false});
      canvas.addEventListener('touchend', endPos);
      canvas.addEventListener('mousedown', startPos);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endPos);
    }

    function loadSignature(src) {
      clearSignature();
      if (!src) return;
      let img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0);
      img.src = src;
    }

    function startPos(e) { isDrawing = true; draw(e); e.preventDefault(); }
    function endPos() { isDrawing = false; ctx.beginPath(); }
    function draw(e) {
      if (!isDrawing) return;
      let rect = canvas.getBoundingClientRect();
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      ctx.lineTo(clientX - rect.left, clientY - rect.top);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(clientX - rect.left, clientY - rect.top);
      e.preventDefault();
    }
    function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    async function goToInspection() {
      const btn = document.getElementById('btn-go');
      btn.innerText = '기존 데이터 확인 중...';
      btn.disabled = true;

      localStorage.setItem('vehicleNum', document.getElementById('vehicleNum').value);
      localStorage.setItem('driverName', document.getElementById('driverName').value);
      localStorage.setItem('companyName', document.getElementById('companyName').value);
      localStorage.setItem('mileage', document.getElementById('mileage').value); 

      const selectedDate = getSelectedDateStr();

      try {
        const response = await fetch(`${SCRIPT_URL}?date=${selectedDate}`);
        const data = await response.json();

        if (data.exists) {
          document.querySelector(`input[name="runStatus"][value="${data.runStatus}"]`).checked = true;
          data.results.forEach((val, index) => {
            document.querySelector(`input[name="item${index}"][value="${val}"]`).checked = true;
          });
          if (data.signature) loadSignature(data.signature);
        } else {
          const runStatus = document.querySelector('input[name="runStatus"]:checked').value;
          if(runStatus === '휴무') {
            items.forEach((_, index) => { document.querySelector(`input[name="item${index}"][value="미"]`).checked = true; });
          } else {
            items.forEach((_, index) => { document.querySelector(`input[name="item${index}"][value="양호"]`).checked = true; });
          }
          loadSignature(localStorage.getItem('savedSignature'));
        }
      } catch (error) {
        alert("서버 연결 지연. 로컬 기본값으로 열립니다.");
        loadSignature(localStorage.getItem('savedSignature'));
      }

      btn.innerText = '점검 화면으로 이동';
      btn.disabled = false;

      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-inspection').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function goBack(screenId) {
      document.getElementById(screenId).classList.add('hidden');
      document.getElementById('screen-start').classList.remove('hidden');
    }

    async function finishInspection() {
      const btn = document.getElementById('btn-save');
      btn.innerText = '서버에 저장 중...';
      btn.disabled = true;
      btn.classList.replace('bg-green-600', 'bg-gray-400');

      const dataURL = canvas.toDataURL();
      localStorage.setItem('savedSignature', dataURL);

      let dailyResults = [];
      items.forEach((_, index) => {
        dailyResults.push(document.querySelector(`input[name="item${index}"]:checked`).value);
      });

      const payload = {
        date: getSelectedDateStr(),
        vehicleNum: document.getElementById('vehicleNum').value,
        driverName: document.getElementById('driverName').value,
        companyName: document.getElementById('companyName').value,
        mileage: document.getElementById('mileage').value, 
        runStatus: document.querySelector('input[name="runStatus"]:checked').value,
        results: dailyResults,
        signature: dataURL
      };

      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert("점검 내역이 성공적으로 덮어쓰기/저장 되었습니다.");
        goBack('screen-inspection');
      } catch (error) {
        alert("저장 중 오류가 발생했습니다.");
      } finally {
        btn.innerText = '점검 완료 및 서버 저장';
        btn.disabled = false;
        btn.classList.replace('bg-gray-400', 'bg-green-600');
      }
    }

    function openMonthlyView() {
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-monthly').classList.remove('hidden');
      loadMonthlyData(); 
    }

    async function loadMonthlyData() {
      const y = parseInt(document.getElementById('viewYear').value, 10);
      const m = parseInt(document.getElementById('viewMonth').value, 10);
      const monthKey = `${y}-${String(m).padStart(2, '0')}`;

      // 해당 월의 마지막 날짜 계산 (28일, 29일, 30일, 31일 자동 감지)
      const maxDays = new Date(y, m, 0).getDate();

      document.getElementById('lbl-month').innerText = `${y}년 ${m}월`;
      document.getElementById('lbl-company').innerText = localStorage.getItem('companyName') || '';
      document.getElementById('lbl-vehicle').innerText = localStorage.getItem('vehicleNum') || '';
      document.getElementById('lbl-driver').innerText = localStorage.getItem('driverName') || '';

      let daysHeader = '';
      for(let i = 1; i <= 31; i++) {
        if (i > maxDays) {
          daysHeader += `<th class="border-black bg-gray-200"></th>`;
        } else {
          daysHeader += `<th class="border-black font-medium">${String(i).padStart(2, '0')}</th>`;
        }
      }
      document.getElementById('days-header').innerHTML = daysHeader;
      
      const tbody = document.getElementById('monthly-tbody');
      tbody.innerHTML = `<tr><td colspan="33" class="text-center py-10 text-lg font-bold text-blue-600">데이터를 불러오는 중입니다...</td></tr>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?month=${monthKey}`);
        const monthData = await response.json();

        let tbodyHtml = '';
        
        // CSS를 배제하고 줄바꿈(<br>) 태그로 정직하게 세로 쓰기를 강제하여 방향 역전 오류 차단
        const groups = [
          { name: '외<br>관<br>점<br>검', span: 4 },
          { name: '상<br>태<br>점<br>검', span: 3 },
          { name: '기<br>타', span: 4 }
        ];
        
        let currentGroup = 0;
        let itemsInGroup = 0;

        items.forEach((item, index) => {
          tbodyHtml += `<tr>`;
          
          if (itemsInGroup === 0) {
            tbodyHtml += `<td rowspan="${groups[currentGroup].span}" class="w-8 border-black font-bold text-center bg-gray-50 leading-loose">${groups[currentGroup].name}</td>`;
          }
          
          tbodyHtml += `<td class="item-text font-medium px-2 py-1 text-left border-black" style="height: 36px;">${index+1}. ${item}</td>`;
          
          for(let d = 1; d <= 31; d++) {
            if (d > maxDays) {
              tbodyHtml += `<td class="border-black bg-gray-200"></td>`;
            } else {
              let resultChar = '';
              if (monthData[String(d)] && monthData[String(d)].results) {
                let val = monthData[String(d)].results[index];
                if (val === '양호') resultChar = 'O';
                else if (val === '불량') resultChar = 'X';
                else if (val === '미') resultChar = '미';
              }
              tbodyHtml += `<td class="border-black">${resultChar}</td>`;
            }
          }
          tbodyHtml += `</tr>`;
          
          itemsInGroup++;
          if (itemsInGroup === groups[currentGroup].span) {
            currentGroup++;
            itemsInGroup = 0;
          }
        });

        const localSign = localStorage.getItem('savedSignature');
        tbodyHtml += `<tr><td colspan="2" class="font-bold bg-gray-100 text-center border-black" style="height: 36px;">점검자 확인(서명)</td>`;
        for(let d = 1; d <= 31; d++) {
          if (d > maxDays) {
            tbodyHtml += `<td class="border-black bg-gray-200"></td>`;
          } else {
            let signHtml = '';
            if (monthData[String(d)] && monthData[String(d)].hasSignature && localSign) {
              signHtml = `<img src="${localSign}" style="height: 20px; width: 100%; object-fit: contain; margin: 0 auto;">`;
            }
            tbodyHtml += `<td class="border-black">${signHtml}</td>`;
          }
        }
        tbodyHtml += `</tr>`;

        // 불량상태 조치 기록: 남은 A4 용지 세로 여백을 다 채우도록 150px 높이와 상단 정렬 지정
        tbodyHtml += `<tr><td colspan="2" class="font-bold bg-gray-100 text-center border-black">불량상태<br>조치 기록</td>`;
        tbodyHtml += `<td colspan="31" class="text-left p-3 border-black text-gray-500 font-medium align-top" style="height: 149px;">(예시) 00일 창닦이기 불량 - 00일 창닦이기 교체</td></tr>`;

        tbody.innerHTML = tbodyHtml;
      } catch(error) {
        tbody.innerHTML = `<tr><td colspan="33" class="text-center py-10 text-red-600 font-bold">데이터 불러오기 실패.</td></tr>`;
      }
    }
  </script>
</body>
</html>
